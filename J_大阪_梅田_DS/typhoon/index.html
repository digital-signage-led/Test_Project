  (function () {
    var q = new URLSearchParams(location.search);
    var host = location.hostname;
    var localDev = host === 'localhost' || host === '127.0.0.1' || host === '';
    var embedded = q.get('embed') === '1' || (window.parent && window.parent !== window);
    var forcePreview = !embedded && q.get('preview') === '1';
    var forceNative = embedded || (!forcePreview && (
      q.get('signage') === '1' ||
      q.get('native640') === '1' ||
      !localDev
    ));
    function setSearch(params) {
      if (embedded) return;
      var next = location.href.split('?')[0].split('#')[0] + '?' + params.toString();
      if (location.href.split('#')[0] !== next) {
        history.replaceState(null, '', next);
      }
    }
    window.__TY_EMBED__ = !!embedded;
    if (forceNative) {
      q.delete('preview');
      q.set('signage', '1');
      q.set('native640', '1');
      if (embedded) q.set('embed', '1');
      setSearch(q);
      document.documentElement.classList.add('native-640');
      if (embedded) document.documentElement.classList.add('ty-embed');
      window.__TY_NATIVE640__ = true;
    } else {
      q.delete('native640');
      q.delete('signage');
      q.set('preview', '1');
      setSearch(q);
      document.documentElement.classList.add('browser-preview');
      window.__TY_NATIVE640__ = false;
    }
  })();

  <script>
(function () {
  'use strict';

  if (typeof L === 'undefined') {
    document.getElementById('toast').innerHTML = '地図ライブラリ読込失敗<br>vendor/leaflet を確認してください';
    return;
  }

  var CFG = {
    width: 640,
    height: 192,
    refreshMs: 5 * 60 * 1000,
    viewMs: 5000,
    sideSwapMs: 6000,
    osaka: [34.702485, 135.495951],
    wideSW: [8, 110],
    wideNE: [48, 155],
    wideCenter: [30, 132],
    nearSW: [24, 120],
    nearNE: [42, 147],
    nearCenter: [34.5, 133.5],
    jamBase: 'https://www.jma.go.jp/bosai/typhoon/data'
  };

  var qs = new URLSearchParams(location.search);
  if (qs.has('lat')) {
    var qLat = parseFloat(qs.get('lat'));
    if (isFinite(qLat) && qLat >= 20 && qLat <= 46) CFG.osaka[0] = qLat;
  }
  if (qs.has('lon')) {
    var qLon = parseFloat(qs.get('lon'));
    if (isFinite(qLon) && qLon >= 122 && qLon <= 154) CFG.osaka[1] = qLon;
  }
  if (qs.has('viewMs')) CFG.viewMs = parseInt(qs.get('viewMs'), 10) || CFG.viewMs;
  if (qs.has('sideSwapMs')) CFG.sideSwapMs = parseInt(qs.get('sideSwapMs'), 10) || CFG.sideSwapMs;

  var native = window.__TY_NATIVE640__ !== false;
  var embedded = !!window.__TY_EMBED__;
  if (native) {
    document.documentElement.classList.add('native-640');
    document.body.classList.add('native-640');
  }
  if (embedded) {
    document.documentElement.classList.add('ty-embed');
    document.body.classList.add('ty-embed');
  }

  function fitStage() {
    var stage = document.getElementById('stage');
    stage.style.left = '0';
    stage.style.top = '0';
    stage.style.marginLeft = '0';
    stage.style.marginTop = '0';
    stage.style.transformOrigin = '0 0';
    if (embedded) {
      stage.style.transform = 'none';
      return;
    }
    if (native) {
      var vw = window.innerWidth || CFG.width;
      var vh = window.innerHeight || CFG.height;
      var sx = vw / CFG.width;
      var sy = vh / CFG.height;
      if (!isFinite(sx) || sx <= 0) sx = 1;
      if (!isFinite(sy) || sy <= 0) sy = 1;
      var s = Math.max(sx, sy);
      stage.style.transform = (Math.abs(s - 1) < 0.01) ? 'none' : ('scale(' + s + ')');
      return;
    }
    var sp = Math.min(window.innerWidth / CFG.width, window.innerHeight / CFG.height);
    if (!isFinite(sp) || sp <= 0) sp = 1;
    stage.style.transform = 'scale(' + sp + ')';
  }

  function ensureNativeViewport(done) {
    if (!native || embedded) {
      fitStage();
      if (done) done();
      return;
    }
    try {
      window.moveTo(0, 0);

  function catRank(cat) {
    var c = String(cat || '').toUpperCase();
    if (c === 'TY') return 4;
    if (c === 'STS') return 3;

    if (c === 'TD' || c === 'L' || c === 'LOW') return 1;

  function catLabel(cat) {

  function tyNumberText(n) {

    if (/^\d+$/.test(s)) return String(parseInt(s, 10));
    return '—';
  }

  function haversineKm(a, b) {
    var R = 6371;
    var toRad = Math.PI / 180;
    var dLat = (b[0] - a[0]) * toRad;
    var dLon = (b[1] - a[1]) * toRad;
    var lat1 = a[0] * toRad;
    var lat2 = b[0] * toRad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  function destPoint(lat, lon, bearingDeg, distM) {
    var R = 6371000;
    var brng = bearingDeg * Math.PI / 180;
    var lat1 = lat * Math.PI / 180;
    var lon1 = lon * Math.PI / 180;
    var ang = distM / R;
    var lat2 = Math.asin(Math.sin(lat1) * Math.cos(ang) + Math.cos(lat1) * Math.sin(ang) * Math.cos(brng));
    var lon2 = lon1 + Math.atan2(
      Math.sin(brng) * Math.sin(ang) * Math.cos(lat1),
      Math.cos(ang) - Math.sin(lat1) * Math.sin(lat2)
    );
    return [lat2 * 180 / Math.PI, ((lon2 * 180 / Math.PI + 540) % 360) - 180];
  }

  function arcLatLngs(center, radiusM, startDeg, endDeg, step) {
    step = step || 4;
    var pts = [];
    var a0 = startDeg;
    var a1 = endDeg;
    if (a1 < a0) a1 += 360;
    for (var a = a0; a <= a1 + 0.0001; a += step) {
      pts.push(destPoint(center[0], center[1], a % 360, radiusM));
    }
    return pts;
  }

  function drawWarningArea(group, area, color, weight, fillOpacity) {
    if (!area) return;
    if (area.center && area.radius) {
      L.circle(area.center, {
        radius: area.radius,
        color: color,
        weight: weight || 1.2,
        opacity: 0.9,
        fillColor: color,
        fillOpacity: fillOpacity == null ? 0.08 : fillOpacity,
        pane: 'ty',
        interactive: false
      }).addTo(group);
    }
    if (area.arc && area.arc.length) {
      area.arc.forEach(function (seg) {
        var c = seg[0];
        var r = seg[1];
        var ang = seg[2] || [0, 360];
        var pts = arcLatLngs(c, r, ang[0], ang[1], 5);
        if (pts.length >= 2) {
          L.polyline(pts, {
            color: color,
            weight: weight || 1.4,
            opacity: 0.85,
            pane: 'ty',
            interactive: false
          }).addTo(group);
        }
      });
    }
    if (area.line && area.line.length) {
      area.line.forEach(function (ln) {
        if (ln && ln.length >= 2) {
          L.polyline(ln, {
            color: color,
            weight: weight || 1.2,
            opacity: 0.75,
            dashArray: '4 3',
            pane: 'ty',
            interactive: false
          }).addTo(group);
        }
      });
    }
  }

  function placeLabels(candidates) {
    /* simple collision avoidance in screen space */
    var placed = [];
    var mapSize = map.getSize();
    candidates.forEach(function (c) {
      var pt = map.latLngToContainerPoint(c.ll);
      var w = (c.text.length * 7) + 10;
      var h = 14;
      var offsets = [
        [10, -12], [-w - 4, -12], [10, 8], [-w - 4, 8],
        [14, -22], [-w - 8, -22], [14, 18], [-w - 8, 18]
      ];
      var chosen = offsets[0];
      for (var i = 0; i < offsets.length; i++) {
        var ox = offsets[i][0];
        var oy = offsets[i][1];
        var rect = { x: pt.x + ox, y: pt.y + oy, w: w, h: h };
        if (rect.x < 2 || rect.y < 2 || rect.x + rect.w > mapSize.x - 2 || rect.y + rect.h > mapSize.y - 2) continue;
        var hit = false;
        for (var j = 0; j < placed.length; j++) {
          var p = placed[j];
          if (!(rect.x + rect.w < p.x || p.x + p.w < rect.x || rect.y + rect.h < p.y || p.y + p.h < rect.y)) {
            hit = true;
            break;
          }
        }
        if (!hit) { chosen = offsets[i]; break; }
      }
      var finalRect = { x: pt.x + chosen[0], y: pt.y + chosen[1], w: w, h: h };
      placed.push(finalRect);
      L.marker(c.ll, {
        interactive: false,
        pane: 'labels',
        icon: L.divIcon({
          className: 'ty-label',
          html: '<span>' + c.text + '</span>',
          iconSize: [1, 1],
          iconAnchor: [-chosen[0], -chosen[1]]
        })
      }).addTo(layerGroup);
    });
  }

  function analysisPart(spec) {
    return (spec || []).find(function (p) { return p && p.advancedHours === 0; }) || null;
  }

  function titlePart(spec) {
    return (spec || []).find(function (p) { return p && p.part === 'title'; }) || null;
  }

  function forecastAnalysis(fc) {
    return (fc || []).find(function (p) { return p && p.advancedHours === 0; }) || null;
  }

  function buildStorm(meta, spec, fc) {
    var title = titlePart(spec) || {};
    var an = analysisPart(spec) || {};
    var fan = forecastAnalysis(fc) || {};
    var cat = (an.category && an.category.en) || meta.category || (title.category && title.category.en) || 'TD';
    var center = (an.position && an.position.deg) || fan.center || null;
    var galeKm = 0;
    if (an.galeWarning && an.galeWarning.length) {
      an.galeWarning.forEach(function (g) {
        var r = g && g.range && g.range.km;
        if (r != null && r > galeKm) galeKm = r;
      });
    } else if (fan.galeWarningArea && fan.galeWarningArea.radius) {
      galeKm = fan.galeWarningArea.radius / 1000;
    }
    var stormKm = 0;
    if (an.stormWarning && an.stormWarning.length) {
      an.stormWarning.forEach(function (g) {
        var r = g && g.range && g.range.km;
        if (r != null && r > stormKm) stormKm = r;
      });
    } else if (fan.stormWarningArea && fan.stormWarningArea.arc && fan.stormWarningArea.arc[0]) {
      stormKm = (fan.stormWarningArea.arc[0][1] || 0) / 1000;
    }
    var distKm = center ? haversineKm(CFG.osaka, center) : null;
    var inGale = distKm != null && galeKm > 0 && distKm <= galeKm;
    var inStorm = distKm != null && stormKm > 0 && distKm <= stormKm;
    var closest = distKm;
    var fcCenters = [];
    (fc || []).forEach(function (p) {
      if (p && p.center && p.advancedHours != null) {
        fcCenters.push(p.center);
        var d = haversineKm(CFG.osaka, p.center);
        if (closest == null || d < closest) closest = d;
      }
    });
    return {
      id: meta.tropicalCyclone,
      meta: meta,
      spec: spec,
      forecast: fc,
      title: title,
      analysis: an,
      fan: fan,
      cat: String(cat).toUpperCase(),
      nameJp: (title.name && title.name.jp) || '名称未定',
      number: title.typhoonNumber || meta.typhoonNumber || '',
      center: center,
      galeKm: galeKm,
      stormKm: stormKm,
      distKm: distKm,
      closestKm: closest,
      inGale: inGale,
      inStorm: inStorm,
      intensity: an.intensity || '-',
      pressure: an.pressure || '—',
      location: an.location || '',
      course: an.course || '',
      speed: an.speed || null,
      issue: (title.issue && title.issue.JST) || meta.issue || '',
      fcCenters: fcCenters
    };
  }

  function impactFor(storm) {
    if (!storm || storm.distKm == null) {
      return {
        pill: '確認中', cls: 'ok',
        main: '影響を確認中',
        sub: '位置データ待機',
        note: '大阪・梅田'
      };
    }
    var d = Math.round(storm.distKm);
    var c = Math.round(storm.closestKm != null ? storm.closestKm : storm.distKm);
    if (storm.inStorm) {
      return {
        pill: '暴風域内', cls: 'danger',
        main: '暴風に注意',
        sub: '中心まで約' + d + 'km',
        note: '最接近見込み 約' + c + 'km'
      };
    }
    if (storm.inGale) {
      return {
        pill: '強風域内', cls: 'alert',
        main: '強風に注意',
        sub: '中心まで約' + d + 'km',
        note: '最接近見込み 約' + c + 'km'
      };
    }
    if (c <= 300) {
      return {
        pill: '接近の可能性', cls: 'warn',
        main: '動向に注意',
        sub: '現在 約' + d + 'km',
        note: '最接近見込み 約' + c + 'km'
      };
    }
    if (c <= 600) {
      return {
        pill: '監視', cls: 'warn',
        main: '影響は限定的',
        sub: '現在 約' + d + 'km',
        note: '最接近見込み 約' + c + 'km'
      };
    }
    return {
      pill: '直接影響小', cls: 'ok',
      main: '大阪は離れている',
      sub: '現在 約' + d + 'km',
      note: '最接近見込み 約' + c + 'km'
    };
  }

  function speedText(speed) {
    if (!speed) return '';
    if (speed.note && speed.note.jp) return speed.note.jp;
    if (speed['km/h']) return '時速' + speed['km/h'] + 'km';
    return '';
  }

  function fillTyPane(prefix, storm) {
    if (!storm) {
      $(prefix + 'TyNum').innerHTML = '—<small>号</small>';
      $(prefix + 'TyName').textContent = '発表なし';
      $(prefix + 'TyCat').className = 'ty-cat NONE';
      $(prefix + 'TyCat').textContent = '台風なし';
      $(prefix + 'TyMeta').textContent = '現在アクティブな台風はありません';
      $(prefix + 'TySub').textContent = '気象庁リアルタイム';
      return;
    }
    $(prefix + 'TyNum').innerHTML = tyNumberText(storm.number) + '<small>号</small>';
    $(prefix + 'TyName').textContent = storm.nameJp;
    $(prefix + 'TyCat').className = 'ty-cat ' + (storm.cat || 'NONE');
    var catTxt = catLabel(storm.cat);
    if (storm.intensity && storm.intensity !== '-') catTxt += '・' + storm.intensity;
    $(prefix + 'TyCat').textContent = catTxt;
    var meta = [];
    if (storm.pressure && storm.pressure !== '—') meta.push(storm.pressure + 'hPa');
    if (storm.analysis && storm.analysis.maximumWind && storm.analysis.maximumWind.sustained) {
      meta.push('最大風速' + storm.analysis.maximumWind.sustained['m/s'] + 'm/s');
    }
    $(prefix + 'TyMeta').textContent = meta.join(' / ') || (storm.location || '');
    var sub = [];
    if (storm.course) sub.push(storm.course);
    var sp = speedText(storm.speed);
    if (sp) sub.push(sp);
    $(prefix + 'TySub').textContent = sub.join(' · ') || (storm.location || '進路図を表示中');
  }

  function fillImpactPane(prefix, storm) {
    var imp = impactFor(storm);
    $(prefix + 'ImpactPill').className = 'impact-pill ' + imp.cls;
    $(prefix + 'ImpactPill').textContent = imp.pill;
    $(prefix + 'ImpactMain').textContent = imp.main;
    $(prefix + 'ImpactSub').textContent = imp.sub;
    $(prefix + 'ImpactNote').textContent = imp.note;
  }

  function focusedStorm() {
    if (!storms.length) return null;
    if (focusStormId) {
      for (var i = 0; i < storms.length; i++) {
        if (storms[i].id === focusStormId) return storms[i];
      }
    }
    var best = storms[0];
    for (var j = 1; j < storms.length; j++) {
      if (catRank(storms[j].cat) > catRank(best.cat)) best = storms[j];
      else if (catRank(storms[j].cat) === catRank(best.cat) &&
        (storms[j].distKm != null) && (best.distKm == null || storms[j].distKm < best.distKm)) best = storms[j];
    }
    return best;
  }

  function updateSidePanels() {
    var s = focusedStorm();
    fillTyPane('left', s);
    fillTyPane('right', s);
    fillImpactPane('left', s);
    fillImpactPane('right', s);
    $('leftTitle').textContent = sideMode === 0 ? '台風情報' : '大阪影響';
    $('rightTitle').textContent = sideMode === 0 ? '大阪影響' : '台風情報';
  }

  function applySideSwap() {
    var leftTy = $('leftTyPane');
    var leftImp = $('leftImpactPane');
    var rightTy = $('rightTyPane');
    var rightImp = $('rightImpactPane');
    if (sideMode === 0) {
      leftTy.classList.add('on'); leftImp.classList.remove('on');
      rightImp.classList.add('on'); rightTy.classList.remove('on');
    } else {
      leftImp.classList.add('on'); leftTy.classList.remove('on');
      rightTy.classList.add('on'); rightImp.classList.remove('on');
    }
    updateSidePanels();
  }

  function startSideSwap() {
    if (sideTimer) clearInterval(sideTimer);
    sideMode = 0;
    applySideSwap();
    sideTimer = setInterval(function () {
      sideMode = sideMode ? 0 : 1;
      applySideSwap();
    }, CFG.sideSwapMs);
  }

  function setFootText(text) {
    var t = text || '台風情報';
    $('footA').textContent = t;
    $('footB').textContent = t;
  }

  function summaryLine() {
    if (!storms.length) return '現在、発表中の台風・熱帯低気圧はありません。　大阪 梅田サイネージ';
    var parts = storms.map(function (s) {
      var n = tyNumberText(s.number);
      var d = s.distKm != null ? ('大阪まで約' + Math.round(s.distKm) + 'km') : '';
      return '台風' + n + '号' + s.nameJp + '（' + catLabel(s.cat) + '）' +
        (s.location ? ' ' + s.location : '') +
        (d ? ' / ' + d : '');
    });
    return parts.join('　　') + '　　出典：気象庁';
  }

  function drawStorms() {
    if (!layerGroup) return;
    layerGroup.clearLayers();
    var labels = [];

    storms.forEach(function (s) {
      var fan = s.fan || {};
      var track = fan.track || {};
      if (track.preTyphoon && track.preTyphoon.length >= 2) {
        L.polyline(track.preTyphoon, {
          color: '#8aa0b8', weight: 1.4, opacity: 0.75, dashArray: '3 4',
          pane: 'ty', interactive: false
        }).addTo(layerGroup);
      }
      if (track.typhoon && track.typhoon.length >= 2) {
        L.polyline(track.typhoon, {
          color: '#ff3355', weight: 2.2, opacity: 0.95,
          pane: 'ty', interactive: false
        }).addTo(layerGroup);
      }

      var fcPts = [];
      (s.forecast || []).forEach(function (p) {
        if (!p || p.advancedHours == null) return;
        if (p.center) fcPts.push(p.center);
        if (p.probabilityCircle && p.center && p.probabilityCircle.radius) {
          L.circle(p.center, {
            radius: p.probabilityCircle.radius,
            color: '#5cc8ff',
            weight: 1,
            opacity: 0.7,
            fillColor: '#5cc8ff',
            fillOpacity: 0.05,
            pane: 'ty',
            interactive: false
          }).addTo(layerGroup);
          var tangents = p.probabilityCircle.tangent || p.probabilityCircle.tangent_3h || [];
          tangents.forEach(function (ln) {
            if (ln && ln.length >= 2) {
              L.polyline(ln, {
                color: '#5cc8ff', weight: 1, opacity: 0.65, dashArray: '2 3',
                pane: 'ty', interactive: false
              }).addTo(layerGroup);
            }
          });
        }
      });
      if (fcPts.length >= 2) {
        L.polyline(fcPts, {
          color: '#5cc8ff', weight: 1.6, opacity: 0.85, dashArray: '5 4',
          pane: 'ty', interactive: false
        }).addTo(layerGroup);
      }

      if (fan.galeWarningArea) drawWarningArea(layerGroup, fan.galeWarningArea, '#ffd166', 1.2, 0.06);
      if (fan.stormWarningArea) drawWarningArea(layerGroup, fan.stormWarningArea, '#ff5c7a', 1.5, 0.08);

      if (s.center) {
        var isTd = catRank(s.cat) <= 1;
        L.marker(s.center, {
          interactive: false,
          pane: 'ty',
          icon: L.divIcon({
            className: '',
            html: isTd ? '<div class="td-dot"></div>' : '<div class="ty-x"></div>',
            iconSize: isTd ? [12, 12] : [18, 18],
            iconAnchor: isTd ? [6, 6] : [9, 9]
          })
        }).addTo(layerGroup);
        labels.push({
          ll: s.center,
          text: '台風' + tyNumberText(s.number) + '号 ' + s.nameJp
        });
      }
    });

    placeLabels(labels);
  }

  function applyView(view) {
    if (!map || !view) return;
    focusStormId = view.stormId || null;
    $('viewText').textContent = view.label || '';
    $('metaLine').textContent = view.meta || '台風進路図';
    if (view.bounds) {
      map.fitBounds(view.bounds, { animate: false, padding: [6, 6], maxZoom: view.maxZoom || 8 });
    } else if (view.center) {
      map.setView(view.center, view.zoom || 5, { animate: false });
    }
    fixMapSize();
    updateSidePanels();
  }

  function buildPlaylist() {
    var list = [];
    list.push({
      id: 'wide',
      label: '日本広域',
      meta: '台風進路図（広域）',
      bounds: L.latLngBounds(CFG.wideSW, CFG.wideNE),
      maxZoom: 5,
      stormId: null
    });
    list.push({
      id: 'near',
      label: '日本近傍',
      meta: '台風進路図（近傍）',
      bounds: L.latLngBounds(CFG.nearSW, CFG.nearNE),
      maxZoom: 6,
      stormId: null
    });
    storms.forEach(function (s) {
      if (!s.center) return;
      var pts = [s.center];
      (s.fcCenters || []).slice(0, 6).forEach(function (c) { pts.push(c); });
      pts.push(CFG.osaka);
      var b = L.latLngBounds(pts);
      b = b.pad(0.55);
      list.push({
        id: 'storm-' + s.id,
        label: '台風' + tyNumberText(s.number) + '号',
        meta: '台風' + tyNumberText(s.number) + '号 ' + s.nameJp + '（' + catLabel(s.cat) + '）',
        bounds: b,
        maxZoom: 7,
        stormId: s.id
      });
    });
    viewPlaylist = list;
  }

  function startViews() {
    if (viewTimer) clearInterval(viewTimer);
    viewIdx = 0;
    if (!viewPlaylist.length) buildPlaylist();
    applyView(viewPlaylist[0]);
    viewTimer = setInterval(function () {
      if (!viewPlaylist.length) return;
      viewIdx = (viewIdx + 1) % viewPlaylist.length;
      applyView(viewPlaylist[viewIdx]);
    }, CFG.viewMs);
  }

  function updateClocks() {
    var t = nowClock();
    $('frameClock').textContent = t;
    $('rightClock').textContent = t;
    $('kindText').textContent = lastIssueText || '発表時刻';
  }

  function stageFromStorms() {
    if (!storms.length) {
      setStageLevel('lv-none');
      return;
    }
    var best = 0;
    storms.forEach(function (s) { best = Math.max(best, catRank(s.cat)); });
    if (best >= 4) setStageLevel('lv-ty');
    else if (best >= 2) setStageLevel('lv-ts');
    else setStageLevel('lv-td');
  }

  async function fetchJson(url) {
    var res = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + url);
    return res.json();
  }

  async function loadAll() {
    showToast('<div><div class="spinner"></div>台風データを取得しています…</div>');
    try {
      var target = await fetchJson(CFG.jamBase + '/targetTc.json');
      if (!Array.isArray(target)) target = [];
      var next = [];
      for (var i = 0; i < target.length; i++) {
        var m = target[i];
        if (!m || !m.tropicalCyclone) continue;
        var id = m.tropicalCyclone;
        var spec = await fetchJson(CFG.jamBase + '/' + id + '/specifications.json');
        var fc = await fetchJson(CFG.jamBase + '/' + id + '/forecast.json');
        next.push(buildStorm(m, spec, fc));
      }
      next.sort(function (a, b) {
        var r = catRank(b.cat) - catRank(a.cat);
        if (r) return r;
        var da = a.distKm == null ? 1e9 : a.distKm;
        var db = b.distKm == null ? 1e9 : b.distKm;
        return da - db;
      });
      storms = next;
      stageFromStorms();
      drawStorms();
      buildPlaylist();
      startViews();
      updateSidePanels();
      setFootText(summaryLine());
      var focus = focusedStorm();
      lastIssueText = focus ? fmtIssue(focus.issue) : '発表なし';
      $('kindBadge').className = 'badge live';
      $('kindBadge').textContent = storms.length ? ('発表 ' + storms.length + '件') : '発表なし';
      showToast('', true);
    } catch (err) {
      console.error(err);
      setStageLevel('lv-err');
      $('kindBadge').className = 'badge err';
      $('kindBadge').textContent = '取得失敗';
      setFootText('台風データの取得に失敗しました。通信を確認してください。');
      showToast('<div>台風データの取得に失敗しました<br>しばらくして再試行します</div>');
    }
    updateClocks();
  }

  function boot() {
    ensureNativeViewport(function () {
      initMap();
      startSideSwap();
      updateClocks();
      setInterval(updateClocks, 1000);
      loadAll();
      setInterval(loadAll, CFG.refreshMs);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
  </script>
</body>
</html>
