<!DOCTYPE html>
<!-- 伊豆諸島北部 512×128 サイネージ / 原点 (0,0) / ロゴなし / 実況＋4日予報＋警報 -->
<!-- 気象庁: AMeDAS 44172 大島 / 予報 130020 / 警報 r8 130000 / 環境省地点 44172（背景色の参照） -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=512, height=128, initial-scale=1, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>伊豆諸島北部 512×128</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Noto+Sans+JP:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --w: 512px;
        --h: 128px;
        --col: 128px;
        --top-h: 32px;
        --body-h: 64px;
        --foot-h: 32px;
        --foot-bg: #fff9f0;
        --wx-bar: #55a5e6;
        --wx-body: #308dd8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 512px;
        height: 128px;
        min-width: 512px;
        min-height: 128px;
        max-width: 512px;
        max-height: 128px;
        overflow: hidden;
        background: #000;
        color: #ebebeb;
        font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      }

      body {
        position: relative;
      }

      .canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 512px;
        height: 128px;
        overflow: hidden;
        transform: none;
        transform-origin: 0 0;
      }

      html.preview,
      html.preview body {
        max-width: none;
        max-height: none;
        min-width: 0;
        min-height: 0;
        width: 100%;
        height: 100%;
      }

      html.preview .canvas {
        transform: scale(min(calc(100vw / 512), calc(100vh / 128)));
        transform-origin: 0 0;
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 512px;
        height: 128px;
        overflow: hidden;
        display: none;
      }

      .scene.active {
        display: block;
      }

      /* ===== 天気 128×128×4 ===== */
      #sceneWeather {
        background: var(--wx-body);
      }

      .wx-scroll {
        position: absolute;
        top: 0;
        left: 0;
        width: 512px;
        height: 128px;
        overflow: hidden;
      }

      .wx-track {
        display: flex;
        flex-direction: row;
        height: 128px;
        will-change: transform;
      }

      .wx-col {
        flex: 0 0 128px;
        width: 128px;
        height: 128px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      .wx-col-top,
      .wx-col-body,
      .wx-col-foot {
        width: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .wx-col-top {
        height: 32px;
        background: var(--wx-bar);
        flex-shrink: 0;
      }

      .wx-col-body {
        height: 64px;
        background: var(--wx-body);
        flex-shrink: 0;
      }

      .wx-col-foot {
        height: 32px;
        background: var(--foot-bg);
        flex-shrink: 0;
      }

      .wx-label {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.2px;
        line-height: 1;
        max-width: 120px;
        white-space: nowrap;
        overflow: hidden;
        color: #ebebeb;
      }

      .wx-col.is-compact .wx-label {
        font-size: 12px;
        letter-spacing: 0;
      }

      .wx-col.is-tight .wx-num {
        font-size: 30px;
      }

      .wx-col.is-tight .wx-unit {
        font-size: 14px;
      }

      .wx-col.is-tight .wx-val {
        gap: 1px;
        max-width: 122px;
      }

      .wx-val {
        display: inline-flex;
        align-items: baseline;
        justify-content: center;
        gap: 2px;
        max-width: 116px;
        white-space: nowrap;
        overflow: hidden;
      }

      .wx-num {
        font-family: "Inter", sans-serif;
        font-size: 44px;
        font-weight: 800;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: #ebebeb;
      }

      .wx-unit {
        font-family: "Inter", sans-serif;
        font-size: 20px;
        font-weight: 700;
        line-height: 1;
        color: #ebebeb;
      }

      .wx-dir {
        font-size: 34px;
        font-weight: 800;
        line-height: 1;
        max-width: 116px;
        white-space: nowrap;
        overflow: hidden;
        color: #ebebeb;
      }

      .wx-loc {
        font-size: 13px;
        font-weight: 700;
        color: #1a1a1a;
        white-space: nowrap;
        max-width: 122px;
        overflow: hidden;
        letter-spacing: 0;
        line-height: 32px;
      }

      .wx-hl {
        display: inline-flex;
        align-items: baseline;
        gap: 2px;
        background: #fff;
        border-radius: 8px;
        padding: 3px 6px 4px;
        line-height: 1;
      }

      .wx-hi {
        color: #e02020;
        font-family: "Inter", sans-serif;
        font-size: 28px;
        font-weight: 800;
      }

      .wx-lo {
        color: #2060e0;
        font-family: "Inter", sans-serif;
        font-size: 28px;
        font-weight: 800;
      }

      .wx-sep,
      .wx-hl-unit {
        color: #1a1a1a;
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 16px;
      }

      .weather-svg {
        width: 54px;
        height: 54px;
      }

      #sceneWeather.wx-dark .wx-label,
      #sceneWeather.wx-dark .wx-num,
      #sceneWeather.wx-dark .wx-unit,
      #sceneWeather.wx-dark .wx-dir,
      #sceneForecast.wx-dark .wx-label,
      #sceneForecast.wx-dark .wx-num,
      #sceneForecast.wx-dark .wx-unit,
      #sceneForecast.wx-dark .fc-sep {
        color: #000;
      }

      /* ===== 4日予報 今日〜明々後日（鴻治組 scene5 と同寸） ===== */
      #sceneForecast {
        background: var(--wx-body);
        overflow: hidden;
      }

      .fc-row {
        display: flex;
        flex-direction: row;
        width: 512px;
        height: 128px;
        overflow: hidden;
      }

      .fc-col {
        flex: 0 0 128px;
        width: 128px;
        min-width: 128px;
        max-width: 128px;
        height: 128px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        box-sizing: border-box;
      }

      .fc-body {
        height: 64px;
        width: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 0 3px;
        background: var(--wx-body);
        flex-shrink: 0;
        box-sizing: border-box;
      }

      .fc-top {
        height: 32px;
        width: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--wx-bar);
        flex-shrink: 0;
        overflow: hidden;
      }

      .fc-top .wx-label {
        font-size: 18px;
        max-width: 120px;
      }

      .fc-foot {
        height: 32px;
        width: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--foot-bg);
        flex-shrink: 0;
        overflow: hidden;
      }

      .fc-weather {
        display: inline-flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 1px;
        max-width: 122px;
        max-height: 60px;
        overflow: hidden;
      }

      .fc-weather .weather-svg {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
      }

      .fc-sep {
        font-family: "Inter", sans-serif;
        font-size: 22px;
        font-weight: 700;
        line-height: 1;
        flex-shrink: 0;
        opacity: 0.9;
        color: #ebebeb;
      }

      .fc-weather .wx-val {
        max-width: 72px;
        gap: 1px;
      }

      .fc-weather .wx-num {
        font-size: 28px;
      }

      .fc-weather .wx-unit {
        font-size: 14px;
      }

      .fc-today-frame {
        position: absolute;
        left: 0;
        top: 0;
        width: 128px;
        height: 128px;
        box-sizing: border-box;
        border: 2px solid #1a1a1a;
        pointer-events: none;
        z-index: 10;
      }

      #sceneForecast:not(.wx-dark) .fc-today-frame {
        border-color: #fff;
      }

      /* ===== 警報 40/48/40（index.html .hero と同寸） ===== */
      .hero {
        width: 512px;
        height: 128px;
        position: relative;
        overflow: hidden;
        display: grid;
        grid-template-rows: 40px 48px 40px;
        grid-template-columns: 512px;
        background: #fa2900;
      }

      .hero.is-advisory {
        background: #f2e700;
      }
      .hero.is-warning {
        background: #fa2900;
      }
      .hero.is-danger {
        background: #ab00aa;
      }
      .hero.is-special {
        background: #000000;
      }
      .hero.is-idle {
        background: #1a2a38;
      }
      .hero.is-white {
        background: #fff9f0;
      }

      .band {
        position: relative;
        width: 512px;
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
      }

      .band-top {
        height: 40px;
      }
      .band-mid {
        height: 48px;
      }
      .band-bot {
        height: 40px;
      }

      .band-mid::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        animation: mid-pulse 1.5s ease-in-out infinite;
      }

      .hero.is-advisory .band-mid::before {
        background: #cdb800;
      }
      .hero.is-warning .band-mid::before {
        background: #c82400;
      }
      .hero.is-danger .band-mid::before {
        background: #7a0078;
      }
      .hero.is-special .band-mid::before {
        background: #333333;
      }
      .hero.is-idle .band-mid::before {
        display: none;
      }
      .hero.is-white .band-mid::before {
        background: #d5d1c9;
        animation: none;
      }

      @keyframes mid-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.88;
        }
      }

      .track {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: row;
        align-items: center;
        height: 100%;
        width: max-content;
        will-change: transform;
      }

      .seg {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: auto;
        min-width: 0;
        max-width: none;
        height: 100%;
        padding: 0 8px;
        gap: 0;
        overflow: hidden;
      }

      .band-mid .seg {
        height: 48px;
        width: auto;
        min-width: 0;
        max-width: none;
        flex: 0 0 auto;
        padding: 0;
        overflow: visible;
      }

      .mid-set {
        display: flex;
        flex-direction: row;
        align-items: center;
        height: 48px;
        gap: 8px;
        padding: 0 8px;
        flex: 0 0 auto;
        box-sizing: border-box;
      }

      .top-label,
      .bot-txt,
      .mid-chip {
        font-weight: 900;
      }

      .unit {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        flex: 0 0 auto;
        width: auto;
        gap: 8px;
        min-width: 0;
        overflow: visible;
      }

      .top-label {
        flex: 0 0 auto;
        min-width: 0;
        overflow: visible;
        white-space: nowrap;
        font-size: 20px;
        line-height: 1;
        letter-spacing: 0.04em;
      }

      .bot-txt {
        display: block;
        width: auto;
        max-width: none;
        max-height: 36px;
        overflow: hidden;
        white-space: normal;
        text-align: center;
        font-size: 14px;
        line-height: 1.15;
        letter-spacing: 0.02em;
      }

      .mid-chip {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        height: 48px;
        white-space: nowrap;
        font-size: 36px;
        line-height: 48px;
        letter-spacing: 0.04em;
        transform: translateY(-3px);
        -webkit-text-stroke: 3px #000;
        paint-order: stroke fill;
        color: #fff;
      }

      .badge {
        flex: 0 0 auto;
        background: #fff;
        padding: 3px 8px;
        border-radius: 2px;
        line-height: 1;
      }

      .badge span {
        display: block;
        color: #1a1a1a;
        font-weight: 900;
        font-size: 15px;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .hero.is-advisory .top-label,
      .hero.is-advisory .bot-txt {
        color: #1a1a1a;
      }

      .hero.is-advisory .mid-chip,
      .hero.is-warning .top-label,
      .hero.is-warning .bot-txt,
      .hero.is-warning .mid-chip,
      .hero.is-danger .top-label,
      .hero.is-danger .bot-txt,
      .hero.is-danger .mid-chip,
      .hero.is-special .top-label,
      .hero.is-special .bot-txt,
      .hero.is-special .mid-chip {
        color: #fff;
      }

      .hero.is-white .top-label,
      .hero.is-white .bot-txt {
        color: #1a1a1a;
      }

      .hero.is-white .band-top,
      .hero.is-white .band-bot {
        overflow: hidden;
      }

      .white-top-seg {
        display: flex;
        flex-direction: row;
        align-items: center;
        height: 40px;
        padding: 0 12px;
        gap: 10px;
        flex: 0 0 auto;
        width: auto;
        box-sizing: border-box;
        white-space: nowrap;
      }

      .white-area {
        flex: 0 0 auto;
        font-size: 15px;
        font-weight: 900;
        color: #0854a8;
        letter-spacing: 0.3px;
        white-space: nowrap;
      }

      .white-what {
        flex: 0 0 auto;
        font-size: 14px;
        font-weight: 700;
        color: #0854a8;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: visible;
      }

      .hero.is-white .badge {
        border: 1px solid #0854a8;
      }

      .hero.is-white .mid-chip {
        padding: 4px 18px;
        min-height: 44px;
        border-radius: 6px;
        font-size: 24px;
        line-height: 1;
        letter-spacing: 0.2px;
        transform: none;
        -webkit-text-stroke: 0;
        paint-order: normal;
        color: #fff;
      }

      /* レベル付きは index.html と同じ従来3段 */
      #heroLevel .mid-chip {
        padding: 0;
        border-radius: 0;
        background: transparent;
        min-height: 48px;
        height: 48px;
        font-size: 36px;
        line-height: 48px;
        letter-spacing: 0.04em;
        transform: translateY(-3px);
        -webkit-text-stroke: 3px #000;
        paint-order: stroke fill;
        color: #fff;
      }

      .hero.is-white .mid-chip.chip-advisory,
      .white-foot-chip.chip-advisory {
        background: #cdb800;
      }
      .hero.is-white .mid-chip.chip-warning,
      .white-foot-chip.chip-warning {
        background: #d62828;
      }
      .hero.is-white .mid-chip.chip-danger,
      .white-foot-chip.chip-danger {
        background: #ab00aa;
      }
      .hero.is-white .mid-chip.chip-special,
      .white-foot-chip.chip-special {
        background: #000;
      }

      .white-foot-seg {
        display: flex;
        flex-direction: row;
        align-items: center;
        height: 40px;
        padding: 0 10px;
        gap: 10px;
        flex: 0 0 auto;
        width: auto;
        box-sizing: border-box;
      }

      .white-foot-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: auto;
        min-width: 148px;
        height: 24px;
        padding: 0 14px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 900;
        color: #fff;
        white-space: nowrap;
        letter-spacing: 0.2px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <svg style="display: none" aria-hidden="true">
      <symbol id="icon-sunny" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="24" fill="#ff4d00" />
        <g stroke="#ff4d00" stroke-width="8" stroke-linecap="round">
          <line x1="60" y1="15" x2="60" y2="30" />
          <line x1="60" y1="90" x2="60" y2="105" />
          <line x1="15" y1="60" x2="30" y2="60" />
          <line x1="90" y1="60" x2="105" y2="60" />
          <line x1="28" y1="28" x2="39" y2="39" />
          <line x1="81" y1="81" x2="92" y2="92" />
          <line x1="28" y1="92" x2="39" y2="81" />
          <line x1="81" y1="39" x2="92" y2="28" />
        </g>
      </symbol>
      <symbol id="icon-cloudy" viewBox="0 0 100 100">
        <path
          d="M25,65 a20,20 0 1,1 20,-20 a25,25 0 1,1 40,5 a15,15 0 1,1 0,30 h-60 a20,20 0 1,1 0,-40"
          fill="#999"
        />
      </symbol>
      <symbol id="icon-rainy" viewBox="0 0 100 100">
        <path
          d="M25,65 a20,20 0 1,1 20,-20 a25,25 0 1,1 40,5 a15,15 0 1,1 0,30 h-60 a20,20 0 1,1 0,-40"
          fill="#666"
        />
        <path

          stroke="#00b0f0"

          stroke-linecap="round"
        />
      </symbol>
    </svg>

    <div class="canvas" id="canvas">
      <div class="scene active" id="sceneWeather">
        <div class="wx-scroll">
          <div class="wx-track" id="wxTrack"></div>
        </div>
      </div>
      <div class="scene" id="sceneForecast">
        <div class="fc-row" id="fcRow"></div>
      </div>
      <div class="scene" id="sceneWarnLevel">
        <div class="hero is-warning" id="heroLevel">
          <div class="band band-top"><div class="track" id="topTrack"></div></div>
          <div class="band band-mid"><div class="track" id="midTrackLevel"></div></div>
          <div class="band band-bot"><div class="track" id="botTrack"></div></div>
        </div>
      </div>
      <div class="scene" id="sceneWarn">
        <div class="hero is-white" id="hero">
          <div class="band band-top"><div class="track" id="whiteTopTrack"></div></div>
          <div class="band band-mid"><div class="track" id="midTrack"></div></div>
          <div class="band band-bot"><div class="track" id="whiteBotTrack"></div></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.get("preview") === "1") document.documentElement.classList.add("preview");
      })();

      const SITE = {
        locationLabel: "伊豆諸島北部",
        amedasLabel: "大島",
        warnArea: "130000",

        amedasPoint: "44172",

      };

      const BOT_L5 = "命を守るための最善の行動をとる\n（すでに災害発生または切迫）";
      const BOT_L4 = "危険な場所から全員避難\n（自治体の「避難指示」相当）";
      const BOT_L3 = "高齢者や避難に時間のかかる人は避難";
      const BOT_L2 = "避難行動・避難経路の確認\n（ハザードマップ等の再チェック）";
      const BOT_WARN = "重大な災害のおそれがあるので注意";
      const BOT_ADV = "災害のおそれがあるので注意";

      const WARN_CATALOG = [
        { codes: ["33"], name: "レベル5大雨特別警報", cls: "special", lv: 5, hasLevel: true, group: "rain", top: "警戒レベル5", bot: BOT_L5 },
        { codes: ["39"], name: "レベル5土砂災害特別警報", cls: "special", lv: 5, hasLevel: true, group: "landslide", top: "警戒レベル5", bot: BOT_L5 },
        { codes: ["34", "51", "53"], name: "レベル5氾濫特別警報", cls: "special", lv: 5, hasLevel: true, group: "flood", top: "警戒レベル5", bot: BOT_L5 },
        { codes: ["38"], name: "レベル5高潮特別警報", cls: "special", lv: 5, hasLevel: true, group: "surge", top: "警戒レベル5", bot: BOT_L5 },
        { codes: ["36"], name: "大雪特別警報", cls: "special", lv: 0, hasLevel: false, group: "snow5", top: "特別警報", bot: BOT_L5 },
        { codes: ["35"], name: "暴風特別警報", cls: "special", lv: 0, hasLevel: false, group: "wind5", top: "特別警報", bot: BOT_L5 },

          hour: "2-digit",
          minute: "2-digit",

        });
        return Object.fromEntries(fmt.formatToParts(new Date(ms)).map((x) => [x.type, x.value]));

        const wc = Number(forecastCode);
        if (Number.isFinite(wc)) {
          const head = Math.floor(wc / 100);
          if (head >= 3) return "#icon-rainy";
          if (head === 2) return "#icon-cloudy";
        }
        const sun = field(obs.sun1h);
        if (sun != null && Number(sun) < 0.2) return "#icon-cloudy";
        return "#icon-sunny";

          - Math.atan(h - 1.676331)
          + 0.00391838 * Math.pow(h, 1.5) * Math.atan(0.023101 * h)
          - 4.686035;
        return 0.7 * tw + 0.3 * t;
      }

      function ymdJst(ms) {
        const p = jstParts(ms);

      function addDaysJst(ms, days) {
        const p = jstParts(ms);
        const d = new Date(p.year + "-" + p.month + "-" + p.day + "T00:00:00+09:00");
        d.setTime(d.getTime() + days * 86400000);
        return ymdJst(d.getTime());

      function findArea(block, code) {
        if (!block || !Array.isArray(block.areas)) return null;
        return block.areas.find((a) => String(a.area && a.area.code) === String(code)) || null;
      }

      function parseDailyForecast(json, todayMax, todayIcon) {
        const now = Date.now();
        const days = FC_LABELS.map((label, i) => ({
          label,
          ymd: addDaysJst(now, i),
          icon: i === 0 && todayIcon ? todayIcon : "#icon-sunny",
          temp: i === 0 && todayMax != null ? String(Math.round(todayMax)) : "--",
        }));
        const byYmd = new Map(days.map((d) => [d.ymd, d]));

        const short = json && json[0];
        const weekly = json && json[1];
        if (short && Array.isArray(short.timeSeries)) {
          short.timeSeries.forEach((block) => {
            const area = findArea(block, SITE.forecastClass10) || findArea(block, SITE.amedasPoint);
            if (!area) return;
            (block.timeDefines || []).forEach((iso, idx) => {
              const ymd = ymdJst(new Date(iso).getTime());
              const day = byYmd.get(ymd);
              if (!day) return;
              if (area.weatherCodes && area.weatherCodes[idx]) {
                if (!(day.label === "今日" && todayIcon)) day.icon = weatherCodeToIcon(area.weatherCodes[idx]);
              }
              if (area.temps && area.temps[idx] !== "" && area.temps[idx] != null) {
                const hour = Number(jstParts(new Date(iso).getTime()).hour);
                if (hour === 9 || day.temp === "--") {
                  if (!(day.label === "今日" && todayMax != null)) day.temp = String(Math.round(Number(area.temps[idx])));
                }
              }
            });
          });
        }
        if (weekly && Array.isArray(weekly.timeSeries)) {
          weekly.timeSeries.forEach((block) => {
            const weatherArea = findArea(block, SITE.forecastWeekly) || findArea(block, SITE.forecastClass10);
            const tempArea = findArea(block, SITE.amedasPoint) || findArea(block, "44263");
            (block.timeDefines || []).forEach((iso, idx) => {

              if (weatherArea && weatherArea.weatherCodes && weatherArea.weatherCodes[idx] && day.label !== "今日") {

              if (tempArea && tempArea.tempsMax && tempArea.tempsMax[idx] !== "" && tempArea.tempsMax[idx] != null && day.temp === "--") {

      function parseJmaR8(payload) {
        const map = new Map();
        const citySet = new Set(SITE.warnCities);
        if (!Array.isArray(payload)) return map;
        payload.forEach((entry) => {
          if (!entry || !entry.warning) return;
          (entry.warning.class20Items || []).forEach((area) => {
            if (!citySet.has(String(area.areaCode))) return;
            (area.kinds || []).forEach((kind) => {
              if (!kind || !kind.code || !ACTIVE_STATUS.has(kind.status)) return;
              collectWarn(map, KIND_CODES[String(kind.code).padStart(2, "0")]);
            });
          });
        });
        return map;
      }

      function parseFlood(payload) {
        const map = new Map();
        const citySet = new Set(SITE.warnCities);
        if (!Array.isArray(payload)) return map;
        payload.forEach((entry) => {
          if (!entry || entry.infoType === "取消") return;
          const name = String((entry.item && entry.item.name) || "");
          if (name.indexOf("解除") >= 0) return;
          const cities = (entry.class20Codes || []).map(String);
          if (!cities.some((c) => citySet.has(c))) return;
          const code = FLOOD_CODE_MAP[String((entry.item && entry.item.code) || "").padStart(2, "0")];
          const meta = KIND_CODES[code];
          if (!meta || meta.group !== "flood") return;
          collectWarn(map, meta);
        });
        return map;
      }

      async function fetchJson(url) {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }

      async function fetchAmedas() {
        const latestTxt = await (await fetch("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", { cache: "no-store" })).text();
        const raw = latestTxt.trim();
        const iso = /[zZ]|[+-]\d{2}:?\d{2}$/.test(raw) ? raw : raw.replace(/\.\d+$/, "") + "+09:00";
        const dt = new Date(iso);
        const p = jstParts(dt.getTime());
        const ymd = p.year + p.month + p.day;
        const hhmm = p.hour + p.minute;
        const block = String(Math.floor(Number(p.hour) / 3) * 3).padStart(2, "0");
        const exact = ymd + hhmm + "00";
        const urls = [
          "https://www.jma.go.jp/bosai/amedas/data/point/" + SITE.amedasPoint + "/" + ymd + "_" + block + ".json",
          "https://www.jma.go.jp/bosai/amedas/data/map/" + ymd + hhmm + "00.json",
        ];
        let obs = null;
        for (const url of urls) {
          try {
            const data = await fetchJson(url);
            if (data.temp) {
              obs = data;
              break;
            }
            if (data[SITE.amedasPoint]) {
              obs = data[SITE.amedasPoint];
              break;
            }
            const keys = Object.keys(data).filter((k) => /^\d{14}$/.test(k)).sort();
            const hit = keys.filter((k) => k <= exact);
            const key = hit.length ? hit[hit.length - 1] : keys[keys.length - 1];
            if (key && data[key]) {
              obs = data[key];
              break;
            }
          } catch (_) {}
        }
        if (!obs) throw new Error("amedas empty");
        return { obs, dt };
      }

      async function fetchForecast() {
        try {
          return await fetchJson("https://www.jma.go.jp/bosai/forecast/data/forecast/" + SITE.forecastArea + ".json");
        } catch (_) {
          return null;
        }
      }

      function forecastCodeFromJson(json) {
        const short = json && json[0];
        const series = short && short.timeSeries;
        if (!Array.isArray(series)) return null;
        for (const block of series) {
          const mine = findArea(block, SITE.forecastClass10);
          if (mine && mine.weatherCodes && mine.weatherCodes[0]) return mine.weatherCodes[0];
        }
        return null;
      }

      function applyAmedas(obs, dt, forecastCode) {
        const temp = field(obs.temp);
        const humi = field(obs.humidity);
        const p10 = field(obs.precipitation10m);
        const wind = field(obs.wind);
        const pres = field(obs.normalPressure) ?? field(obs.pressure);
        const wdir = field(obs.windDirection);
        const maxT = field(obs.maxTemp);
        const minT = field(obs.minTemp);
        const gust = field(obs.gust);
        const p = jstParts(dt.getTime());
        weather = {
          icon: weatherIcon(obs, forecastCode),
          temp: temp != null ? String(Math.round(Number(temp))) : "--",
          rain: p10 != null ? Number(p10).toFixed(1) : "--",
          dir: wdir != null ? dirJa(wdir) : "--",
          wind: wind != null ? Number(wind).toFixed(1) : "--",
          humi: humi != null ? String(Math.round(Number(humi))) : "--",
          pres: pres != null ? String(Math.round(Number(pres))) : "--",
          tmax: maxT != null ? String(Math.round(Number(maxT))) : "--",
          tmin: minT != null ? String(Math.round(Number(minT))) : "--",
          gust: gust != null ? Number(gust).toFixed(1) : "--",
          time: p.hour + ":" + p.minute,
          date: Number(p.month) + "/" + Number(p.day),
        };
        applyWxColors(wbgtApprox(temp != null ? Number(temp) : null, humi != null ? Number(humi) : null));
        renderWeather();
      }

      async function loadWeather() {
        const [{ obs, dt }, fcJson] = await Promise.all([fetchAmedas(), fetchForecast()]);
        const code = forecastCodeFromJson(fcJson);
        applyAmedas(obs, dt, code);
        const todayMax = field(obs.maxTemp) != null ? Number(field(obs.maxTemp)) : null;
        parseDailyForecast(fcJson, todayMax, weather.icon);
        renderForecast();
      }

      async function loadWarn() {
        try {
          const warn = await fetchJson("https://www.jma.go.jp/bosai/warning/data/r8/" + SITE.warnArea + ".json");
          let floodItems = new Map();
          try {
            floodItems = parseFlood(await fetchJson("https://www.jma.go.jp/bosai/flood/data/r8/flood_xml.json"));
          } catch (_) {}
          const map = parseJmaR8(warn);
          floodItems.forEach((item, key) => {
            const prev = map.get(key);
            if (!prev || item.lv > prev.lv) map.set(key, item);
          });
          warnItems = [...map.values()].sort((a, b) => a.rank - b.rank);
          levelItems = warnItems.filter((x) => x.hasLevel);
          plainItems = warnItems.filter((x) => !x.hasLevel);
        } catch (e) {
          warnItems = [];
          levelItems = [];
          plainItems = [];
          console.warn("[警報]", e);
        }
      }

      function showScene(el) {
        [sceneWeather, sceneForecast, sceneWarn, sceneWarnLevel].forEach((s) => {
          s.classList.toggle("active", s === el);
          s.style.display = s === el ? "block" : "none";
        });
        applyScrollX(el, 0);
      }

      function applyScrollX(el, x) {
        el.style.transform = "translate3d(" + Math.round(x) + "px,0,0)";
      }

      function transitionTo(nextEl, onDone) {
        const cur = document.querySelector(".canvas .scene.active") || sceneWeather;
        if (cur === nextEl) {
          onDone();
          return;
        }
        nextEl.style.display = "block";
        nextEl.classList.add("active");
        applyScrollX(nextEl, 512);
        const t0 = performance.now();
        function tick(now) {
          const p = Math.min(1, (now - t0) / SLIDE_MS);
          const eased = p * (2 - p);
          const off = eased * 512;
          applyScrollX(cur, -off);
          applyScrollX(nextEl, 512 - off);
          if (p < 1) requestAnimationFrame(tick);
          else {
            cur.classList.remove("active");
            cur.style.display = "none";
            applyScrollX(nextEl, 0);
            onDone();
          }
        }
        requestAnimationFrame(tick);
      }

      function makeTopSeg(scene) {
        const seg = document.createElement("div");
        seg.className = "seg";
        const unit = document.createElement("div");
        unit.className = "unit";
        const level = document.createElement("span");
        level.className = "top-label";
        level.textContent = scene.levelLabel;
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.innerHTML = "<span>" + scene.badge + "</span>";
        unit.append(level, badge);
        seg.appendChild(unit);
        return seg;
      }

      function makeMidSeg(scene) {
        const seg = document.createElement("div");
        seg.className = "seg";
        const chip = document.createElement("span");
        chip.className = "mid-chip";
        chip.textContent = scene.mid;
        seg.appendChild(chip);
        return seg;
      }

      function makeMidChip(scene) {
        const chip = document.createElement("span");
        chip.className = "mid-chip chip-" + scene.cls;
        chip.textContent = scene.mid;
        return chip;
      }

      function makeWhiteTopSeg(label) {
        const seg = document.createElement("div");
        seg.className = "white-top-seg";
        const area = document.createElement("span");
        area.className = "white-area";
        area.textContent = SITE.locationLabel;
        const what = document.createElement("span");
        what.className = "white-what";
        what.textContent = label;
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.innerHTML = "<span>発表中</span>";
        seg.append(area, what, badge);
        return seg;
      }

      function makeWhiteBotSeg() {
        const seg = document.createElement("div");
        seg.className = "white-foot-seg";
        [
          ["chip-special", "特別警報"],
          ["chip-warning", "警報"],
          ["chip-advisory", "注意報"],
        ].forEach(([cls, name]) => {
          const chip = document.createElement("span");
          chip.className = "white-foot-chip " + cls;
          chip.textContent = name;
          seg.appendChild(chip);
        });
        return seg;
      }

      function fillMidChips(track, items) {
        track.style.transform = "translate3d(0,0,0)";
        const set = document.createElement("div");
        set.className = "mid-set";
        items.forEach((item) => set.appendChild(makeMidChip(item)));
        track.replaceChildren(set);
      }

      function prepareMidChips(track) {
        const set = track.children[0];
        if (!set) return 0;
        set.style.width = "auto";
        set.style.minWidth = "0";
        set.style.maxWidth = "none";
        const w = Math.max(1, Math.ceil(set.offsetWidth));
        set.style.width = w + "px";
        set.style.minWidth = w + "px";
        set.style.maxWidth = w + "px";
        set.style.flex = "0 0 " + w + "px";
        while (track.children.length > 1) track.removeChild(track.lastChild);
        for (let i = 1; i < 8; i++) track.appendChild(set.cloneNode(true));
        return w;
      }

      function fillBotLines(el, text) {
        el.replaceChildren();
        String(text)
          .split("\n")
          .forEach((line, i) => {
            if (i) el.appendChild(document.createElement("br"));
            el.appendChild(document.createTextNode(line));
          });
      }

      function makeBotSeg(scene) {
        const seg = document.createElement("div");
        seg.className = "seg";
        const txt = document.createElement("span");
        txt.className = "bot-txt";
        fillBotLines(txt, scene.bot);
        seg.appendChild(txt);
        return seg;
      }

      function fillTrack(track, makeSeg, scene) {
        track.style.transform = "translate3d(0,0,0)";
        track.replaceChildren(makeSeg(scene));
      }

      function fitToWidth(el, maxW, maxPx) {
        if (!el) return;
        el.style.letterSpacing = "0.02em";
        el.style.fontSize = maxPx + "px";
        el.style.width = "auto";
        el.style.maxWidth = "none";
        let w = el.offsetWidth;
        if (w > maxW && w > 0) {
          el.style.fontSize = Math.max(8, (maxW / w) * maxPx) + "px";
          w = el.offsetWidth;
        }
        if (w > maxW) {
          el.style.letterSpacing = "0";
          w = el.offsetWidth;
        }
        if (w > maxW && w > 0) el.style.fontSize = Math.max(7, (maxW / w) * parseFloat(el.style.fontSize)) + "px";
        el.style.maxWidth = maxW + "px";
        el.style.overflow = "hidden";
      }

      function fitBot(el, maxH) {
        if (!el) return;
        el.style.whiteSpace = "normal";
        el.style.width = "auto";
        el.style.maxWidth = "none";
        el.style.flex = "0 0 auto";
        let size = 16;
        el.style.fontSize = size + "px";
        el.style.lineHeight = "1.15";
        let guard = 20;
        while (el.scrollHeight > maxH && size > 10 && guard-- > 0) {
          size -= 0.5;
          el.style.fontSize = size + "px";
        }
      }

      function lockSegWidth(el, w) {
        el.style.width = w + "px";
        el.style.minWidth = w + "px";
        el.style.maxWidth = w + "px";
        el.style.flex = "0 0 " + w + "px";
      }

      function prepareTrack(track) {
        const first = track.children[0];
        if (!first) return 0;
        const mid = first.querySelector(".mid-chip");
        const bot = first.querySelector(".bot-txt");
        const top = first.querySelector(".top-label");
        const unit = first.querySelector(".unit");
        if (bot) fitBot(bot, 36);
        if (top) {
          top.style.flex = "0 0 auto";
          top.style.width = "auto";
          top.style.maxWidth = "none";
          top.style.fontSize = "20px";
          top.style.letterSpacing = "0.04em";
        }
        if (unit) {
          unit.style.width = "auto";
          unit.style.flex = "0 0 auto";
        }
        first.style.width = "auto";
        first.style.minWidth = "0";
        first.style.maxWidth = "none";
        let loopW;
        if (mid) {
          mid.style.fontSize = "36px";
          mid.style.letterSpacing = "0.04em";
          mid.style.transform = "translateY(-3px)";
          mid.style.width = "auto";
          mid.style.maxWidth = "none";
          mid.style.flex = "0 0 auto";
          first.style.padding = "0";
          loopW = Math.max(1, Math.ceil(mid.offsetWidth + 6 + 12));
        } else {
          loopW = Math.max(1, Math.ceil(first.offsetWidth));
        }
        lockSegWidth(first, loopW);
        while (track.children.length > 1) track.removeChild(track.lastChild);
        for (let i = 1; i < 8; i++) track.appendChild(first.cloneNode(true));
        return loopW;
      }

      function playLevelItem(index) {
        if (!levelItems.length) {
          playWhite();
          return;
        }
        const gen = ++playGen;
        const scene = levelItems[index];
        heroLevel.className = "hero is-" + scene.cls;
        fillTrack(topTrack, makeTopSeg, scene);
        fillTrack(midTrackLevel, makeMidSeg, scene);
        fillTrack(botTrack, makeBotSeg, scene);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (gen !== playGen) return;
            const loopWs = [prepareTrack(topTrack), prepareTrack(midTrackLevel), prepareTrack(botTrack)];
            if (rafId) cancelAnimationFrame(rafId);
            let scrollX = 0;
            let lastTs = 0;
            const oneLoop = loopWs[1] || UNIT_W;
            const step = (ts) => {
              if (gen !== playGen) return;
              if (!lastTs) lastTs = ts;
              const dt = Math.min(0.05, (ts - lastTs) / 1000);
              lastTs = ts;
              scrollX += SPEED * dt;
              [topTrack, midTrackLevel, botTrack].forEach((track, i) => {
                const w = loopWs[i];
                if (w < 1) return;
                track.style.transform = "translate3d(" + -(scrollX % w) + "px,0,0)";
              });
              if (oneLoop > 0 && scrollX >= oneLoop) {
                const next = index + 1;
                if (next < levelItems.length) playLevelItem(next);
                else playWhite();
                return;
              }
              rafId = requestAnimationFrame(step);
            };
            rafId = requestAnimationFrame(step);
          });
        });
      }

      function playWhite() {
        if (!plainItems.length) {
          playWeather();
          return;
        }
        const gen = ++playGen;
        if (rafId) cancelAnimationFrame(rafId);
        const go = () => {
          if (gen !== playGen) return;
          const highest = plainItems[0];
          hero.className = "hero is-white";
          let label = highest.levelLabel || "気象警報・注意報";
          if (label.indexOf("警戒レベル") === 0) label = "気象警報・注意報";
          whiteTopTrack.style.transform = "translate3d(0,0,0)";
          whiteBotTrack.style.transform = "translate3d(0,0,0)";
          whiteTopTrack.replaceChildren(makeWhiteTopSeg(label));
          whiteBotTrack.replaceChildren(makeWhiteBotSeg());
          fillMidChips(
            midTrack,
            plainItems.filter((x) => !x.hasLevel)
          );
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (gen !== playGen) return;
              const loopWs = [
                prepareMidChips(whiteTopTrack),
                prepareMidChips(midTrack),
                prepareMidChips(whiteBotTrack),
              ];
              let scrollX = 0;
              let lastTs = 0;
              const oneLoop = loopWs[1] || UNIT_W;
              const step = (ts) => {
                if (gen !== playGen) return;
                if (!lastTs) lastTs = ts;
                const dt = Math.min(0.05, (ts - lastTs) / 1000);
                lastTs = ts;
                scrollX += SPEED * dt;
                [whiteTopTrack, midTrack, whiteBotTrack].forEach((track, i) => {
                  const w = loopWs[i];
                  if (w < 1) return;
                  track.style.transform = "translate3d(" + -(scrollX % w) + "px,0,0)";
                });
                if (oneLoop > 0 && scrollX >= oneLoop) {
                  playWeather();
                  return;
                }
                rafId = requestAnimationFrame(step);
              };
              rafId = requestAnimationFrame(step);
            });
          });
        };
        transitionTo(sceneWarn, go);
      }

      function playAlerts() {
        if (levelItems.length) {
          transitionTo(sceneWarnLevel, () => playLevelItem(0));
        } else {
          playWhite();
        }
      }

      function playWarn() {
        playAlerts();
      }

      function playAfterForecast() {
        if (levelItems.length || plainItems.length) playAlerts();
        else playWeather();
      }

      function playForecast() {
        const gen = ++playGen;
        if (rafId) cancelAnimationFrame(rafId);
        transitionTo(sceneForecast, () => {
          if (gen !== playGen) return;
          renderForecast();
          const t0 = performance.now();
          const step = (ts) => {
            if (gen !== playGen) return;
            if (ts - t0 >= FC_HOLD_MS) {
              playAfterForecast();
              return;
            }
            rafId = requestAnimationFrame(step);
          };
          rafId = requestAnimationFrame(step);
        });
      }

      function playWeather() {
        const gen = ++playGen;
        if (rafId) cancelAnimationFrame(rafId);
        transitionTo(sceneWeather, () => {
          if (gen !== playGen) return;
          renderWeather();
          const need = Math.max(WX_COL, wxSetW * WX_LAPS - 512);
          let total = 0;
          let lastTs = 0;
          wxTrack.style.transform = "translate3d(0,0,0)";
          const step = (ts) => {
            if (gen !== playGen) return;
            if (!lastTs) lastTs = ts;
            const dt = Math.min(0.05, (ts - lastTs) / 1000);
            lastTs = ts;
            total += SPEED * dt;
            wxTrack.style.transform = "translate3d(" + -Math.round(total % wxSetW) + "px,0,0)";
            if (total >= need) {
              playForecast();
              return;
            }
            rafId = requestAnimationFrame(step);
          };
          rafId = requestAnimationFrame(step);
        });
      }

      async function boot() {
        renderWeather();
        renderForecast();
        try {
          await Promise.all([loadWeather().catch((e) => console.warn("[天気]", e)), loadWarn()]);
        } catch (e) {
          console.warn("[起動]", e);
        }
        if (levelItems.length || plainItems.length) {
          if (levelItems.length) {
            showScene(sceneWarnLevel);
            playLevelItem(0);
          } else {
            showScene(sceneWarn);
            playWhite();
          }
        } else {
          showScene(sceneWeather);
          playWeather();
        }
        setInterval(() => {
          loadWeather().catch(() => {});
          loadWarn();
        }, POLL_MS);
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(boot).catch(boot);
      } else {
        boot();
      }
    </script>
  </body>
</html>
