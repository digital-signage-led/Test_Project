<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>騒音振動モニター</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  /* bodyと枠を100%にして、led-cloudの枠いっぱいに広げる */
  html, body, .signage-box {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    position: relative;
  }

  /* 中身のWebページ */
  .signage-box iframe {
    border: none;
    position: absolute;
    
    /* 画面サイズ */
    width: 1200px;
    height: 900px;

    transform-origin: 0 0;
    
    /* ★ 縮小を解除して大きく表示（1.0 = 100%） */
    transform: scale(1.0);
    
    /* 位置の微調整 */
    left: -280px;
    top: -230px;
  }
</style>
</head>
<body>

  <div class="signage-box">
    <iframe src="https://www2.edam.ne.jp/Public/00642/Sokutei/SSC/RN?LoID=738" scrolling="no"></iframe>
  </div>

</body>
</html>
