<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=558, height=424">
<title>騒音振動モニター</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  /* サイネージ枠（W558px * H424px） */
  html, body {
    width: 558px;
    height: 424px;
    overflow: hidden;
    background: #000;
  }

  /* 切り抜き枠 */
  .crop {
    position: absolute;
    top: 0;
    left: 0;
    width: 605px;
    height: 540px;
    overflow: hidden;
    transform-origin: 0 0;

    /* ★【倍率・引き伸ばし調整】
       scale(横倍率, 縦倍率)
       2番目の数字を「0.785」から「0.85」「0.9」のように大きくすると縦に伸びます */
    transform: scale(0.922, 0.785);
  }

  /* 元サイトの位置（新URL対応） */
  .crop iframe {
    border: none;
    position: absolute;
    width: 1920px;
    height: 1080px;

    /* ★【位置の移動調整】
       left: 左右の移動（数字を動かして位置合わせ）
       top : 上下の移動（数字を動かして位置合わせ） */
    left: -700px;
    top: -204px;
  }
</style>
</head>
<body>

  <div class="crop">
    <iframe
      src="https://www2.edam.ne.jp/Public/18237/Sokutei/SSC/RN"
      scrolling="no"
    ></iframe>
  </div>

</body>
</html>
