<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=557, initial-scale=1.0">
<title>騒音振動モニター</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }

  /* 1. led-cloud側の枠サイズ */
  .signage-box {
    width: 557px;
    height: 400px;
    position: relative;
    overflow: hidden;
  }

  /* 2. 中身（Webページ） */
  .signage-box iframe {
    border: none;
    position: absolute;
    
    /* ★文字・グラフを大きくするため、描画幅を1200pxから700pxにキュッと縮めます */
    width: 700px;
    height: 550px;

    transform-origin: 0 0;
    
    /* ★拡大倍率（1.0より大きくするとさらに拡大されます） */
    transform: scale(1.15);
    
    /* 表示位置の調整 */
    left: -120px;
    top: -140px;
  }
</style>
</head>
<body>

  <div class="signage-box">
    <iframe src="https://www2.edam.ne.jp/Public/00642/Sokutei/SSC/RN?LoID=738" scrolling="no"></iframe>
  </div>

</body>
</html>
