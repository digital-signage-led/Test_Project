<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>騒音振動モニター</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }

  /* 1. 表示枠 */
  .signage-box {
    width: 557px;
    height: 400px;
    position: relative;
    overflow: hidden;
  }

  /* 2. 中身（Webページ） */
  .signage-box iframe {
    border: none;
    position: absolute;
    
    width: 1200px;
    height: 900px;

    transform-origin: 0 0;
    transform: scale(0.83);
    
    left: -280px;
    top: -230px;
  }
</style>
</head>
<body>

  <div class="signage-box">
    <iframe src="https://www2.edam.ne.jp/Public/00642/Sokutei/SSC/RN?LoID=738" scrolling="no"></iframe>
  </div>

</body>
</html>
